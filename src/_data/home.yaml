dna:
  eyebrow: Our DNA
  heading: Clothing that doesn't shout, but whispers.
  paragraphs:
    - In a world that seems to be growing louder, the need for calm, clarity, and depth increases. The modern man craves simplicity — not only visible but also tangible and wearable. Indigold was born from this movement — a brand that combines craftsmanship, elegance, and authenticity with an urban, cosmopolitan flair.
    - Indigold is a Dutch brand through and through — considered, understated, built with intention. Every piece is chosen for quality, comfort and durability, so it becomes part of his everyday, not just his wardrobe.
  quote: Colour speaks in silence. Character shows in every shade.
  image: assets/img/portrait_foliage.jpg
  image_alt: Indigold FW26 model portrait among greenery, wearing a knitted vest
  image_tag: FW26 · Portrait
